name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish "src/Elegant Panel Scaffolding/Elegant Panel Scaffolding.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "src/Elegant Panel Scaffolding/bin/Release/net10.0-windows/win-x64/publish" `
            -p:EnableWindowsTargeting=true

      - name: Package release binaries
        shell: pwsh
        run: |
          $publishDir = 'src/Elegant Panel Scaffolding/bin/Release/net10.0-windows/win-x64/publish'
          $releaseDir = 'release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $archivePath = Join-Path $releaseDir 'ElegantPanelScaffolding.zip'

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archivePath -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
